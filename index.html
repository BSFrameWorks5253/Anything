<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anything</title>
    <!-- Non-blocking font prefetch with instantaneous system fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
    <style>
      /* Zero-delay instant backdrop */
      html, body {
        background-color: #030712;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      /* Standalone Splash mode: 100% transparent desktop background */
      html.splash-mode, body.splash-mode, .splash-mode body, .splash-mode #root {
        background: transparent !important;
        background-color: transparent !important;
      }
      .splash-mode #root:empty {
        background: transparent !important;
      }
      .splash-mode #root:empty::after {
        display: none !important;
      }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: radial-gradient(circle at 50% 30%, rgba(56, 189, 248, 0.12), transparent 70%), #030712;
      }
      #root:empty::after {
        content: '';
        width: 32px;
        height: 32px;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      if (window.location.search.includes('view=splash')) {
        document.documentElement.classList.add('splash-mode');
        document.documentElement.style.backgroundColor = 'transparent';
        document.documentElement.style.background = 'transparent';
      }

      window.addEventListener('error', function(e) {
        console.error('[UNCAUGHT RENDERER ERROR]', e.error || e.message);
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          var errText = e.error ? (e.error.stack || e.error.message) : e.message;
          root.innerHTML = '<div style="padding: 32px; color: #f87171; font-family: sans-serif; text-align: center; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #030712;"><h2 style="font-size: 20px; font-weight: 700; margin-bottom: 12px; color: #ef4444;">Anything Initialization Error</h2><pre style="background: rgba(255,255,255,0.06); padding: 16px; border-radius: 8px; text-align: left; max-width: 600px; overflow: auto; font-size: 13px; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.1); white-space: pre-wrap;">' + errText + '</pre><button onclick="localStorage.clear(); window.location.reload();" style="margin-top: 16px; padding: 10px 24px; background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Reset Cache & Reload</button></div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('[UNHANDLED PROMISE REJECTION]', e.reason);
      });
    </script>
  </head>
  <body class="bg-slate-950 text-white selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
