<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 54" width="850" height="54">
  <defs>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b10"/>
      <stop offset="100%" stop-color="#14141f"/>
    </linearGradient>
  </defs>
  <style>
    .terminal-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #38bdf8;
    }
    .prompt { fill: #ef4444; font-weight: bold; }
    .cursor {
      animation: blink 0.9s infinite;
