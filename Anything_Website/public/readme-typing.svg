    }
  </style>
  <rect x="1" y="1" width="848" height="52" rx="14" fill="url(#boxBg)" stroke="#262635" stroke-width="1.5"/>
  <circle cx="24" cy="27" r="4.5" fill="#ef4444"/>
  <circle cx="38" cy="27" r="4.5" fill="#f59e0b"/>
  <circle cx="52" cy="27" r="4.5" fill="#10b981"/>
