<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a10"/>
      <stop offset="50%" stop-color="#12121c"/>
      <stop offset="100%" stop-color="#07070b"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="orbRed" cx="15%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCyan" cx="85%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      font-size: 50px;
      letter-spacing: -1px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.5px;
      fill: #38bdf8;
    }
    .sub-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      fill: #a1a1aa;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #e4e4e7;
    }
    .pulse-dot {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { fill-opacity: 1; }
      50% { fill-opacity: 0.3; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="320" rx="24" fill="url(#bgGrad)" stroke="#27273a" stroke-width="2"/>
  <rect width="1000" height="320" rx="24" fill="url(#orbRed)"/>
  <rect width="1000" height="320" rx="24" fill="url(#orbCyan)"/>

  <!-- Top Badge -->
  <g transform="translate(345, 36)">
    <rect width="310" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="18" cy="15" r="4" fill="#ef4444" class="pulse-dot"/>
    <text x="32" y="19" class="badge-text">APPLE WWDC26 LIQUID GLASS</text>
  </g>

  <!-- Big Title -->
  <text x="500" y="130" text-anchor="middle" fill="url(#titleGrad)" class="brand-title">
    ANYTHING · CREATIVE SUITE
  </text>

  <!-- Subtitle -->
  <text x="500" y="168" text-anchor="middle" class="sub-title">
    The Sovereign Adobe Acrobat &amp; Creative Cloud Desktop Alternative.
  </text>
  <text x="500" y="192" text-anchor="middle" class="sub-title">
    100% Free Forever · Zero Subscriptions · Client-Side Direct3D Sandbox.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(180, 236)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="145" height="36" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="72" y="22" text-anchor="middle" class="pill-text">📄 Free PDF Master</text>

    <!-- Pill 2 -->
    <rect x="160" y="0" width="155" height="36" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="237" y="22" text-anchor="middle" class="pill-text">📐 CAD Blueprints</text>

    <!-- Pill 3 -->
    <rect x="330" y="0" width="155" height="36" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="407" y="22" text-anchor="middle" class="pill-text">⚡ Universal Fusion</text>

    <!-- Pill 4 -->
    <rect x="500" y="0" width="140" height="36" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="570" y="22" text-anchor="middle" class="pill-text">🔒 0$ Commercial</text>
  </g>
</svg>
